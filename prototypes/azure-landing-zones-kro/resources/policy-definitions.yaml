# Custom policy definition templates (reference / standalone)
#
# Most ALZ assignments target *built-in* Azure policy definitions referenced by
# their stable ARM id (e.g. /providers/Microsoft.Authorization/policyDefinitions/<guid>).
# Built-ins do not need a CR — the assignment just points at them.
#
# Custom definitions, however, must exist as objects in Azure first. The
# prototype ships one illustrative custom definition so the
# PolicyDefinition → ManagementGroupPolicyAssignment edge is visible end to end.
#
# Source mapping:
#   Azure-Landing-Zones-Library/platform/alz/policy_definitions/*.alz_policy_definition.json
#
# Provider: Upbound provider-azure-authorization
# CRD:      authorization.azure.upbound.io/v1beta1/PolicyDefinition
---
apiVersion: authorization.azure.upbound.io/v1beta1
kind: PolicyDefinition
metadata:
  name: alz-deny-publicip-on-nic
spec:
  forProvider:
    displayName: "ALZ – Network interfaces should not have public IPs"
    description: >-
      Denies creation of NICs that carry a Public IP, enforced at the
      management group scope.
    mode: All
    policyType: Custom
    # Scope of the *definition* (where it lives). Distinct from the assignment scope.
    managementGroupId: alz-alz
    policyRule: |
      {
        "if": {
          "allOf": [
            { "field": "type", "equals": "Microsoft.Network/networkInterfaces" },
            { "field": "Microsoft.Network/networkInterfaces/ipConfigurations[*].publicIpAddress.id", "exists": "true" }
          ]
        },
        "then": { "effect": "[parameters('effect')]" }
      }
    parameters: |
      {
        "effect": {
          "type": "String",
          "allowedValues": ["Audit", "Deny", "Disabled"],
          "defaultValue": "Deny",
          "metadata": { "displayName": "Effect", "description": "Policy effect." }
        }
      }
