# corp → Deny-Public-IP-On-NIC (custom def from ./policy-definitions.yaml)
apiVersion: authorization.azure.upbound.io/v1beta1
kind: ManagementGroupPolicyAssignment
metadata:
  name: alz-corp-deny-publicip-on-nic
spec:
  forProvider:
    displayName: "ALZ – Deny Public IP on NIC (corp)"
    managementGroupId: alz-corp
    # In the kro graph this is ${pdDenyPublicIpOnNic.status.atProvider.id} so the
    # custom PolicyDefinition is created first. Here it is shown as the resolved id.
    policyDefinitionIdRef:
      name: alz-deny-publicip-on-nic
    location: westeurope
    identity:
      - type: SystemAssigned
    parameters: |
      { "effect": { "value": "Deny" } }
