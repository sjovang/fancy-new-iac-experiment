# Policy assignment templates (reference / standalone)
#
# These manifests show the shape of each ManagementGroupPolicyAssignment the
# kro graph renders. See ../mapping.md for the full archetype → assignment
# matrix and which subset is included in the prototype.
#
# Source mapping:
#   Azure-Landing-Zones-Library/platform/alz/policy_assignments/<Name>.alz_policy_assignment.json
#   Azure-Landing-Zones-Library/platform/alz/archetype_definitions/<archetype>.alz_archetype_definition.json
#
# Provider: Upbound provider-azure-authorization
# CRD:      authorization.azure.upbound.io/v1beta1/ManagementGroupPolicyAssignment
#
# Edge rules (encoded as CEL refs in ../resourcegraph.yaml — flattened here for review):
#   - Each assignment scope (managementGroupId) is one of the MG names from
#     ./management-groups.yaml, so kro waits for that MG.
#   - Assignments that target a custom definition reference the definition by
#     name (here: alz-deny-publicip-on-nic from ./policy-definitions.yaml).
---
# connectivity → Enable-DDoS-VNET
apiVersion: authorization.azure.upbound.io/v1beta1
kind: ManagementGroupPolicyAssignment
metadata:
  name: alz-enable-ddos-vnet
spec:
  forProvider:
    displayName: "Virtual networks should be protected by Azure DDoS Network Protection"
    description: "ALZ connectivity guardrail."
    managementGroupId: alz-connectivity
    policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/94de2ad3-e0c1-4caf-ad78-5d47bbc83d3d
    location: westeurope
    identity:
      - type: SystemAssigned
    parameters: |
      {
        "ddosPlan": { "value": "<ddos-plan-id>" },
        "effect":   { "value": "Modify" }
      }
---
