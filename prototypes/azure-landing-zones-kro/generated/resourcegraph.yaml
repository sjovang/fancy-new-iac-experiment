    - id: pdDeployASCSecurityContacts
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: PolicyDefinition
        metadata:
          name: ${schema.spec.prefix}-deploy-asc-securitycontacts
        spec:
          forProvider:
            displayName: Deploy Microsoft Defender for Cloud Security Contacts
            description: Deploy Microsoft Defender for Cloud Security Contacts
            mode: All
            policyType: Custom
            managementGroupId: ${mgAlz.status.atProvider.id}
            policyRule: |-
              {
                "if": {
                  "allOf": [
                    {
                      "equals": "Microsoft.Resources/subscriptions",
                      "field": "type"
                    }
                  ]
                },
                "then": {
                  "details": {
                    "deployment": {
                      "location": "northeurope",
                      "properties": {
                        "mode": "incremental",
                        "parameters": {
                          "attackPathSeverity": {
                            "value": "[parameters('attackPathSeverity')]"
                          },
                          "emailSecurityContact": {
                            "value": "[parameters('emailSecurityContact')]"
                          },
                          "minimalSeverity": {
                            "value": "[parameters('minimalSeverity')]"
                          }
                        },
                        "template": {
                          "$schema": "https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#",
                          "contentVersion": "1.0.0.0",
                          "outputs": {},
                          "parameters": {
                            "attackPathSeverity": {
                              "metadata": {
                                "description": "Attack path severity level reported"
                              },
                              "type": "string"
                            },
                            "emailSecurityContact": {
                              "metadata": {
                                "description": "Security contacts email address"
                              },
                              "type": "string"
                            },
                            "minimalSeverity": {
                              "metadata": {
                                "description": "Minimal severity level reported"
                              },
                              "type": "string"
                            }
                          },
                          "resources": [
                            {
                              "apiVersion": "2023-12-01-preview",
                              "name": "default",
                              "properties": {
                                "emails": "[parameters('emailSecurityContact')]",
                                "isEnabled": true,
                                "notificationsByRole": {
                                  "roles": [
                                    "Owner"
                                  ],
                                  "state": "On"
                                },
                                "notificationsSources": [
                                  {
                                    "minimalSeverity": "[parameters('minimalSeverity')]",
                                    "sourceType": "Alert"
                                  },
                                  {
                                    "minimalRiskLevel": "[parameters('attackPathSeverity')]",
                                    "sourceType": "AttackPath"
                                  }
                                ]
                              },
                              "type": "Microsoft.Security/securityContacts"
                            }
                          ],
                          "variables": {}
                        }
                      }
                    },
                    "deploymentScope": "subscription",
                    "existenceCondition": {
                      "allOf": [
                        {
                          "contains": "[parameters('emailSecurityContact')]",
                          "field": "Microsoft.Security/securityContacts/email"
                        },
                        {
                          "equals": true,
                          "field": "Microsoft.Security/securityContacts/isEnabled"
                        },
                        {
                          "count": {
                            "field": "Microsoft.Security/securityContacts/notificationsSources[*]",
                            "where": {
                              "allOf": [
                                {
                                  "equals": "Alert",
                                  "field": "Microsoft.Security/securityContacts/notificationsSources[*].sourceType"
                                },
                                {
                                  "equals": "[parameters('minimalSeverity')]",
                                  "field": "Microsoft.Security/securityContacts/notificationsSources[*].Alert.minimalSeverity"
                                }
                              ]
                            }
                          },
                          "greaterOrEquals": 1
                        },
                        {
                          "count": {
                            "field": "Microsoft.Security/securityContacts/notificationsSources[*]",
                            "where": {
                              "allOf": [
                                {
                                  "equals": "AttackPath",
                                  "field": "Microsoft.Security/securityContacts/notificationsSources[*].sourceType"
                                },
                                {
                                  "equals": "[parameters('attackPathSeverity')]",
                                  "field": "Microsoft.Security/securityContacts/notificationsSources[*].AttackPath.minimalRiskLevel"
                                }
                              ]
                            }
                          },
                          "greaterOrEquals": 1
                        }
                      ]
                    },
                    "existenceScope": "subscription",
                    "roleDefinitionIds": [
                      "/providers/Microsoft.Authorization/roleDefinitions/fb1c8493-542b-48eb-b624-b4c8fea62acd"
                    ],
                    "type": "Microsoft.Security/securityContacts"
                  },
                  "effect": "[parameters('effect')]"
                }
              }
            parameters: |-
              {
                "attackPathSeverity": {
                  "allowedValues": [
                    "Critical",
                    "High",
                    "Medium",
                    "Low"
                  ],
                  "defaultValue": "Critical",
                  "metadata": {
                    "description": "Defines the minimal attack path risk level which will be sent as email notifications",
                    "displayName": "Attack path severity"
                  },
                  "type": "String"
                },
                "effect": {
                  "allowedValues": [
                    "DeployIfNotExists",
                    "Disabled"
                  ],
                  "defaultValue": "DeployIfNotExists",
                  "metadata": {
                    "description": "Enable or disable the execution of the policy",
                    "displayName": "Effect"
                  },
                  "type": "String"
                },
                "emailSecurityContact": {
                  "metadata": {
                    "description": "Provide email addresses (semi-colon separated) for Defender for Cloud contact details",
                    "displayName": "Security contacts email address"
                  },
                  "type": "String"
                },
                "minimalSeverity": {
                  "allowedValues": [
                    "High",
                    "Medium",
                    "Low"
                  ],
                  "defaultValue": "High",
                  "metadata": {
                    "description": "Defines the minimal alert severity which will be sent as email notifications",
                    "displayName": "Minimal severity"
                  },
                  "type": "String"
                }
              }
            metadata: |-
              {
                "alzCloudEnvironments": [
                  "AzureCloud",
                  "AzureChinaCloud",
                  "AzureUSGovernment"
                ],
                "category": "Security Center",
                "source": "https://github.com/Azure/Enterprise-Scale/",
                "version": "3.0.0"
              }
    - id: pdDeployBudget
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: PolicyDefinition
        metadata:
          name: ${schema.spec.prefix}-deploy-budget
        spec:
          forProvider:
            displayName: Deploy a default budget on all subscriptions under the assigned scope
            description: Deploy a default budget on all subscriptions under the assigned scope
            mode: All
            policyType: Custom
            managementGroupId: ${mgAlz.status.atProvider.id}
            policyRule: |-
              {
                "if": {
                  "allOf": [
                    {
                      "equals": "Microsoft.Resources/subscriptions",
                      "field": "type"
                    }
                  ]
                },
                "then": {
                  "details": {
                    "deployment": {
                      "location": "northeurope",
                      "properties": {
                        "mode": "Incremental",
                        "parameters": {
                          "amount": {
                            "value": "[parameters('amount')]"
                          },
                          "budgetName": {
                            "value": "[parameters('budgetName')]"
                          },
                          "contactEmails": {
                            "value": "[parameters('contactEmails')]"
                          },
                          "contactGroups": {
                            "value": "[parameters('contactGroups')]"
                          },
                          "contactRoles": {
                            "value": "[parameters('contactRoles')]"
                          },
                          "firstThreshold": {
                            "value": "[parameters('firstThreshold')]"
                          },
                          "secondThreshold": {
                            "value": "[parameters('secondThreshold')]"
                          },
                          "timeGrain": {
                            "value": "[parameters('timeGrain')]"
                          }
                        },
                        "template": {
                          "$schema": "http://schema.management.azure.com/schemas/2018-05-01/subscriptionDeploymentTemplate.json",
                          "contentVersion": "1.0.0.0",
                          "parameters": {
                            "amount": {
                              "type": "String"
                            },
                            "budgetName": {
                              "type": "String"
                            },
                            "contactEmails": {
                              "type": "Array"
                            },
                            "contactGroups": {
                              "type": "Array"
                            },
                            "contactRoles": {
                              "type": "Array"
                            },
                            "firstThreshold": {
                              "type": "String"
                            },
                            "secondThreshold": {
                              "type": "String"
                            },
                            "startDate": {
                              "defaultValue": "[concat(utcNow('MM'), '/01/', utcNow('yyyy'))]",
                              "type": "String"
                            },
                            "timeGrain": {
                              "type": "String"
                            }
                          },
                          "resources": [
                            {
                              "apiVersion": "2019-10-01",
                              "name": "[parameters('budgetName')]",
                              "properties": {
                                "amount": "[parameters('amount')]",
                                "category": "Cost",
                                "notifications": {
                                  "NotificationForExceededBudget1": {
                                    "contactEmails": "[parameters('contactEmails')]",
                                    "contactGroups": "[parameters('contactGroups')]",
                                    "contactRoles": "[parameters('contactRoles')]",
                                    "enabled": true,
                                    "operator": "GreaterThan",
                                    "threshold": "[parameters('firstThreshold')]"
                                  },
                                  "NotificationForExceededBudget2": {
                                    "contactEmails": "[parameters('contactEmails')]",
                                    "contactGroups": "[parameters('contactGroups')]",
                                    "contactRoles": "[parameters('contactRoles')]",
                                    "enabled": true,
                                    "operator": "GreaterThan",
                                    "threshold": "[parameters('secondThreshold')]"
                                  }
                                },
                                "timeGrain": "[parameters('timeGrain')]",
                                "timePeriod": {
                                  "startDate": "[parameters('startDate')]"
                                }
                              },
                              "type": "Microsoft.Consumption/budgets"
                            }
                          ]
                        }
                      }
                    },
                    "deploymentScope": "subscription",
                    "existenceCondition": {
                      "allOf": [
                        {
                          "equals": "[parameters('amount')]",
                          "field": "Microsoft.Consumption/budgets/amount"
                        },
                        {
                          "equals": "[parameters('timeGrain')]",
                          "field": "Microsoft.Consumption/budgets/timeGrain"
                        },
                        {
                          "equals": "Cost",
                          "field": "Microsoft.Consumption/budgets/category"
                        }
                      ]
                    },
                    "existenceScope": "subscription",
                    "roleDefinitionIds": [
                      "/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c"
                    ],
                    "type": "Microsoft.Consumption/budgets"
                  },
                  "effect": "[parameters('effect')]"
                }
              }
            parameters: |-
              {
                "amount": {
                  "defaultValue": "1000",
                  "metadata": {
                    "description": "The total amount of cost or usage to track with the budget"
                  },
                  "type": "String"
                },
                "budgetName": {
                  "defaultValue": "budget-set-by-policy",
                  "metadata": {
                    "description": "The name for the budget to be created"
                  },
                  "type": "String"
                },
                "contactEmails": {
                  "defaultValue": [],
                  "metadata": {
                    "description": "The list of email addresses, in an array, to send the budget notification to when the threshold is exceeded."
                  },
                  "type": "Array"
                },
                "contactGroups": {
                  "defaultValue": [],
                  "metadata": {
                    "description": "The list of action groups, in an array, to send the budget notification to when the threshold is exceeded. It accepts array of strings."
                  },
                  "type": "Array"
                },
                "contactRoles": {
                  "defaultValue": [
                    "Owner",
                    "Contributor"
                  ],
                  "metadata": {
                    "description": "The list of contact RBAC roles, in an array, to send the budget notification to when the threshold is exceeded."
                  },
                  "type": "Array"
                },
                "effect": {
                  "allowedValues": [
                    "DeployIfNotExists",
                    "AuditIfNotExists",
                    "Disabled"
                  ],
                  "defaultValue": "DeployIfNotExists",
                  "metadata": {
                    "description": "Enable or disable the execution of the policy"
                  },
                  "type": "String"
                },
                "firstThreshold": {
                  "defaultValue": "90",
                  "metadata": {
                    "description": "Threshold value associated with a notification. Notification is sent when the cost exceeded the threshold. It is always percent and has to be between 0 and 1000."
                  },
                  "type": "String"
                },
                "secondThreshold": {
                  "defaultValue": "100",
                  "metadata": {
                    "description": "Threshold value associated with a notification. Notification is sent when the cost exceeded the threshold. It is always percent and has to be between 0 and 1000."
                  },
                  "type": "String"
                },
