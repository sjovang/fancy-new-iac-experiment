    - id: pdDeployPrivateDNSGeneric
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: PolicyDefinition
        metadata:
          name: ${schema.spec.prefix}-deploy-private-dns-generic
        spec:
          forProvider:
            displayName: Deploy-Private-DNS-Generic
            description: Configure private DNS zone group to override the DNS resolution for PaaS services private endpoint. See https://aka.ms/pepdnszones for information on values to provide to parameters in this policy.
            mode: All
            policyType: Custom
            managementGroupId: ${mgAlz.status.atProvider.id}
            policyRule: |-
              {
                "if": {
                  "allOf": [
                    {
                      "equals": "[parameters('location')]",
                      "field": "location"
                    },
                    {
                      "equals": "Microsoft.Network/privateEndpoints",
                      "field": "type"
                    },
                    {
                      "count": {
                        "field": "Microsoft.Network/privateEndpoints/privateLinkServiceConnections[*]",
                        "where": {
                          "allOf": [
                            {
                              "contains": "[parameters('resourceType')]",
                              "field": "Microsoft.Network/privateEndpoints/privateLinkServiceConnections[*].privateLinkServiceId"
                            },
                            {
                              "equals": "[parameters('groupId')]",
                              "field": "Microsoft.Network/privateEndpoints/privateLinkServiceConnections[*].groupIds[*]"
                            }
                          ]
                        }
                      },
                      "greaterOrEquals": 1
                    }
                  ]
                },
                "then": {
                  "details": {
                    "deployment": {
                      "properties": {
                        "mode": "incremental",
                        "parameters": {
                          "location": {
                            "value": "[field('location')]"
                          },
                          "privateDnsZoneId": {
                            "value": "[parameters('privateDnsZoneId')]"
                          },
                          "privateEndpointName": {
                            "value": "[field('name')]"
                          }
                        },
                        "template": {
                          "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
                          "contentVersion": "1.0.0.0",
                          "parameters": {
                            "location": {
                              "type": "string"
                            },
                            "privateDnsZoneId": {
                              "type": "string"
                            },
                            "privateEndpointName": {
                              "type": "string"
                            }
                          },
                          "resources": [
                            {
                              "apiVersion": "2020-03-01",
                              "location": "[parameters('location')]",
                              "name": "[concat(parameters('privateEndpointName'), '/deployedByPolicy')]",
                              "properties": {
                                "privateDnsZoneConfigs": [
                                  {
                                    "name": "PaaS-Service-Private-DNS-Zone-Config",
                                    "properties": {
                                      "privateDnsZoneId": "[parameters('privateDnsZoneId')]"
                                    }
                                  }
                                ]
                              },
                              "type": "Microsoft.Network/privateEndpoints/privateDnsZoneGroups"
                            }
                          ]
                        }
                      }
                    },
                    "evaluationDelay": "[parameters('evaluationDelay')]",
                    "roleDefinitionIds": [
                      "/providers/Microsoft.Authorization/roleDefinitions/4d97b98b-1d4f-4787-a291-c67834d212e7"
                    ],
                    "type": "Microsoft.Network/privateEndpoints/privateDnsZoneGroups"
                  },
                  "effect": "[parameters('effect')]"
                }
              }
            parameters: |-
              {
                "effect": {
                  "allowedValues": [
                    "DeployIfNotExists",
                    "Disabled"
                  ],
                  "defaultValue": "DeployIfNotExists",
                  "metadata": {
                    "description": "Enable or disable the execution of the policy",
                    "displayName": "Effect"
                  },
                  "type": "String"
                },
                "evaluationDelay": {
