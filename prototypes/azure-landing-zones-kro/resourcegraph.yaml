apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: azure-landing-zone
spec:
  schema:
    apiVersion: iac.experiment/v1alpha1
    kind: AzureLandingZone
    spec:
      # Tenant root MG ID (e.g. the tenant ID) under which the ALZ hierarchy is created.
      rootParentId: string | required=true
      # Prefix prepended to every MG name so multiple ALZ deployments can coexist (e.g. "contoso").
      prefix: string | required=true default="alz"
      # Default Azure region used by policy assignments that require a location.
      location: string | required=true default="westeurope"
      # Per-archetype overrides surfaced as named inputs; assignments read these via ${schema.spec...}.
      ddosPlanId: string | default=""
      logAnalyticsWorkspaceId: string | default=""

  resources:
    # ---------------------------------------------------------------------
    # Management group hierarchy
    # Each MG references its parent through a CEL ref → kro infers the edge.
    # Source: architecture_definitions/alz.alz_architecture_definition.json
    # ---------------------------------------------------------------------
    - id: mgIntermediateRoot
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-alz
        spec:
          forProvider:
            displayName: Azure Landing Zones
            parentManagementGroupId: ${schema.spec.rootParentId}

    - id: mgPlatform
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-platform
        spec:
          forProvider:
            displayName: Platform
            parentManagementGroupId: ${mgIntermediateRoot.status.atProvider.id}

    - id: mgConnectivity
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-connectivity
        spec:
          forProvider:
            displayName: Connectivity
            parentManagementGroupId: ${mgPlatform.status.atProvider.id}

    - id: mgIdentity
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-identity
        spec:
          forProvider:
            displayName: Identity
            parentManagementGroupId: ${mgPlatform.status.atProvider.id}

    - id: mgManagement
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-management
        spec:
          forProvider:
            displayName: Management
            parentManagementGroupId: ${mgPlatform.status.atProvider.id}

    - id: mgSecurity
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-security
        spec:
          forProvider:
            displayName: Security
            parentManagementGroupId: ${mgPlatform.status.atProvider.id}

    - id: mgLandingZones
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-landingzones
        spec:
          forProvider:
            displayName: Landing zones
            parentManagementGroupId: ${mgIntermediateRoot.status.atProvider.id}

    - id: mgCorp
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-corp
        spec:
          forProvider:
            displayName: Corp
            parentManagementGroupId: ${mgLandingZones.status.atProvider.id}

    - id: mgOnline
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-online
        spec:
          forProvider:
            displayName: Online
            parentManagementGroupId: ${mgLandingZones.status.atProvider.id}

    - id: mgLocal
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-local
        spec:
          forProvider:
            displayName: Local
            parentManagementGroupId: ${mgLandingZones.status.atProvider.id}

    - id: mgSandbox
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-sandbox
        spec:
          forProvider:
            displayName: Sandbox
            parentManagementGroupId: ${mgIntermediateRoot.status.atProvider.id}

    - id: mgDecommissioned
      template:
        apiVersion: management.azure.upbound.io/v1beta1
        kind: ManagementGroup
        metadata:
          name: ${schema.spec.prefix}-decommissioned
        spec:
          forProvider:
            displayName: Decommissioned
            parentManagementGroupId: ${mgIntermediateRoot.status.atProvider.id}

    # ---------------------------------------------------------------------
    # Custom policy definitions
    # Most ALZ assignments target built-in policy IDs (no CR needed).
    # This one custom def demonstrates the def → assignment edge.
    # Source: policy_definitions/Deny-PublicIP-On-NIC.alz_policy_definition.json
    # ---------------------------------------------------------------------
    - id: pdDenyPublicIpOnNic
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: PolicyDefinition
        metadata:
          name: ${schema.spec.prefix}-deny-publicip-on-nic
        spec:
          forProvider:
            displayName: "ALZ – Network interfaces should not have public IPs"
            description: "Denies creation of NICs that carry a Public IP, enforced at the management group scope."
            mode: All
            policyType: Custom
            managementGroupId: ${mgIntermediateRoot.status.atProvider.id}
            policyRule: |
              {
                "if": {
                  "allOf": [
                    { "field": "type", "equals": "Microsoft.Network/networkInterfaces" },
                    { "field": "Microsoft.Network/networkInterfaces/ipConfigurations[*].publicIpAddress.id", "exists": "true" }
                  ]
                },
                "then": { "effect": "[parameters('effect')]" }
              }
            parameters: |
              {
                "effect": {
                  "type": "String",
                  "allowedValues": ["Audit", "Deny", "Disabled"],
                  "defaultValue": "Deny",
                  "metadata": { "displayName": "Effect", "description": "Policy effect." }
                }
              }

    # ---------------------------------------------------------------------
    # Policy assignments (subset of ALZ archetypes — see mapping.md)
    # Each assignment references the MG it is scoped to → kro infers the edge,
    # so MGs are reconciled before their assignments.
    # ---------------------------------------------------------------------

    # connectivity → Enable-DDoS-VNET
    - id: paEnableDdosVnet
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-enable-ddos-vnet
        spec:
          forProvider:
            displayName: "Virtual networks should be protected by Azure DDoS Network Protection"
            description: "ALZ connectivity guardrail. See policy_assignments/Enable-DDoS-VNET.alz_policy_assignment.json."
            managementGroupId: ${mgConnectivity.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/94de2ad3-e0c1-4caf-ad78-5d47bbc83d3d
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              {
                "ddosPlan": { "value": "${schema.spec.ddosPlanId}" },
                "effect":   { "value": "Modify" }
              }

    # identity → Deny-MgmtPorts-Internet
    - id: paDenyMgmtPortsInternetIdentity
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-identity-deny-mgmtports-internet
        spec:
          forProvider:
            displayName: "Management ports of virtual machines should be protected with just-in-time network access control"
            managementGroupId: ${mgIdentity.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/22730e10-96f6-4aac-ad84-9383d35b5917
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Deny" } }

    # identity → Deny-Public-IP
    - id: paDenyPublicIpIdentity
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-identity-deny-public-ip
        spec:
          forProvider:
            displayName: "Public network access should be disabled (identity scope)"
            managementGroupId: ${mgIdentity.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/6c112d4e-5bc7-47ae-a041-ea2d9dccd749
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Deny" } }

    # corp → Audit-PeDnsZones
    - id: paAuditPeDnsZonesCorp
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-corp-audit-pe-dns-zones
        spec:
          forProvider:
            displayName: "Audit Private Endpoint DNS zone configuration"
            managementGroupId: ${mgCorp.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/55c4db33-97b0-437b-8469-c4f4498ac2dd
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Audit" } }

    # corp → Deny-Public-IP-On-NIC (uses the *custom* PolicyDefinition declared above)
    # The reference to pdDenyPublicIpOnNic.status.atProvider.id makes kro reconcile
    # the PolicyDefinition before this ManagementGroupPolicyAssignment.
    - id: paDenyPublicIpOnNicCorp
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-corp-deny-publicip-on-nic
        spec:
          forProvider:
            displayName: "ALZ – Deny Public IP on NIC (corp)"
            managementGroupId: ${mgCorp.status.atProvider.id}
            policyDefinitionId: ${pdDenyPublicIpOnNic.status.atProvider.id}
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Deny" } }

    # landing_zones → Deny-IP-forwarding
    - id: paDenyIpForwardingLz
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-lz-deny-ip-forwarding
        spec:
          forProvider:
            displayName: "IP forwarding on a network interface should be disabled"
            managementGroupId: ${mgLandingZones.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/88c0b9da-ce96-4b03-9635-f29a937e2900
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Deny" } }

    # landing_zones → Deny-Storage-http
    - id: paDenyStorageHttpLz
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-lz-deny-storage-http
        spec:
          forProvider:
            displayName: "Secure transfer to storage accounts should be enabled"
            managementGroupId: ${mgLandingZones.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/404c3081-a854-4457-ae30-26a93ef643f9
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "Deny" } }

    # platform → Deploy-MDFC-DefSQL-AMA
    - id: paDeployMdfcDefSqlAmaPlatform
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-platform-deploy-mdfc-defsql-ama
        spec:
          forProvider:
            displayName: "Deploy MDFC Defender for SQL via AMA"
            managementGroupId: ${mgPlatform.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policySetDefinitions/de01d381-bae9-4670-8870-786f89f49e26
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              {
                "logAnalyticsWorkspaceId": { "value": "${schema.spec.logAnalyticsWorkspaceId}" }
              }

    # local → Enforce-ALDO-Services
    - id: paEnforceAldoLocal
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-local-enforce-aldo-services
        spec:
          forProvider:
            displayName: "Allowed locations for Azure Local"
            managementGroupId: ${mgLocal.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policyDefinitions/e56962a6-4747-49cd-b67b-bf8b01975c4c
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "listOfAllowedLocations": { "value": ["${schema.spec.location}"] } }

    # decommissioned → Enforce-ALZ-Decomm
    - id: paEnforceAlzDecomm
      template:
        apiVersion: authorization.azure.upbound.io/v1beta1
        kind: ManagementGroupPolicyAssignment
        metadata:
          name: ${schema.spec.prefix}-decomm-enforce-alz-decomm
        spec:
          forProvider:
            displayName: "Enforce ALZ Decommissioned guardrails"
            managementGroupId: ${mgDecommissioned.status.atProvider.id}
            policyDefinitionId: /providers/Microsoft.Authorization/policySetDefinitions/ALZ-Decomm
            location: ${schema.spec.location}
            identity:
              - type: SystemAssigned
            parameters: |
              { "effect": { "value": "DenyAction" } }
